# Informazioni Base del Sito
title: "DevHacker Blog"
description: "Esplorando il mondo della programmazione e tecnologia"
baseurl: ""
url: "https://username.github.io"

# Autore
author:
  name: "Vincenzo Ingrosso"
  email: "vincenzo@ingrosso.net"
  bio: "Sviluppatore Full-Stack appassionato di open source"
  avatar: "/assets/images/avatar.jpg"
  github: "slackarea"
  linkedin: "username"
  twitter: "username"

# Tema e Markdown
theme: hacker
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true

# Plugin Essenziali
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-gist
  - jekyll-github-metadata

# Paginazione
paginate: 5
paginate_path: "/blog/page:num/"

# Collections (per organizzare contenuti)
collections:
  progetti:
    output: true
    permalink: /:collection/:name/
  tutorial:
    output: true
    permalink: /:collection/:name/

# Impostazioni di Build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - README.md

# Impostazioni Feed RSS
feed:
  excerpt_only: true

# Impostazioni SEO
logo: "/assets/images/logo.png"
social:
  name: "Il Tuo Nome"
  links:
    - https://github.com/username
    - https://linkedin.com/in/username

# Analytics (opzionale)
google_analytics: "G-XXXXXXXXXX"

# Commenti Disqus (opzionale)
disqus:
  shortname: "il-tuo-shortname"

# Impostazioni Locali
timezone: Europe/Rome
lang: it_IT
